[client]
toolbarMode = "minimal"
showErrorDetails = "none"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
runOnSave = false
enableStaticServing = true  # serves ./static (illustrations) at app/static/

[theme]
base = "dark"  # thème « sapin » : fond vert, texte crème (les cartes crème sont gérées dans app.py)
font = "'Courier Prime', 'Courier New', monospace"
baseRadius = "medium"
showWidgetBorder = false
primaryColor = "#E8806B"
backgroundColor = "#24392C"
secondaryBackgroundColor = "#2F4A38"
textColor = "#F3E6CF"
borderColor = "#3E5E48"
